<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cape Canaveral Launchpad // Countdown Timer</title>
    
    <link rel="stylesheet" href="css/rel-core.css">

    <style>
        body {
            background: radial-gradient(circle at 50% 15%, #241304 0%, #110902 50%, #060301 100%);
            min-height: 100vh;
            color: #fef3c7;
        }

        .timer-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: calc(100vh - var(--rel-hud-height));
            padding: 30px 20px;
        }

        .app-container {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* --- Cape Canaveral Launch Control Deck --- */
        .input-card {
            background: linear-gradient(160deg, #1c1005 0%, #120902 60%, #080401 100%);
            padding: 34px 40px;
            border-radius: 22px;
            box-shadow: 
                0 0 0 1px rgba(255, 159, 26, 0.3),
                0 0 45px rgba(255, 159, 26, 0.15),
                0 25px 60px rgba(0, 0, 0, 0.9);
            border: 2px solid #3d2208;
            position: relative;
            overflow: hidden;
        }

        /* Launchpad hazard stripe top bar */
        .input-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: repeating-linear-gradient(
                -45deg,
                #ff9f1a,
                #ff9f1a 12px,
                #000000 12px,
                #000000 24px
            );
            box-shadow: 0 0 16px rgba(255, 159, 26, 0.7);
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 16px; 
            border-bottom: 1.5px solid rgba(255, 159, 26, 0.25);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 1.5px solid #ff9f1a;
            box-shadow: 0 0 16px rgba(255, 159, 26, 0.4);
            object-fit: cover;
            background: #000;
        }

        .brand-text-container {
            display: flex;
            flex-direction: column;
        }

        .launch-badge {
            display: inline-block;
            align-self: flex-start;
            font-family: var(--rel-font-mono);
            font-size: 0.62rem;
            color: #ff9f1a;
            background: rgba(255, 159, 26, 0.15);
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 4px;
            border: 1px solid rgba(255, 159, 26, 0.35);
        }

        .brand-title {
            color: #ffffff;
            font-family: var(--rel-font-display);
            font-size: 1.45rem; 
            font-weight: 900;
            text-transform: uppercase;
            margin: 0;
            line-height: 1.1;
            letter-spacing: 1px;
        }

        .brand-subtitle {
            color: #ff9f1a;
            font-family: var(--rel-font-mono);
            font-size: 0.8rem; 
            font-weight: 600;
            margin-top: 3px;
            letter-spacing: 0.6px;
        }

        .controls {
            display: grid;
            grid-template-columns: 2fr 1.2fr 1.2fr auto;
            gap: 16px;
            align-items: end;
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group label {
            font-family: var(--rel-font-mono);
            font-size: 0.75rem;
            color: #fcd34d;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid #3d2309;
            background-color: #0a0502;
            color: white;
            font-family: var(--rel-font-sans);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #ff9f1a;
            box-shadow: 0 0 16px rgba(255, 159, 26, 0.4);
        }

        .btn-start {
            background: linear-gradient(180deg, #d35400 0%, #a04000 100%);
            color: #ffffff;
            border: 1.5px solid rgba(255, 159, 26, 0.6);
            padding: 12px 24px;
            border-radius: 12px;
            font-family: var(--rel-font-display);
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            height: 48px;
            box-shadow: 0 0 20px rgba(211, 84, 0, 0.4);
            outline: none;
        }

        .btn-start:hover {
            background: #ff9f1a;
            color: #0a0502;
            box-shadow: 0 0 28px rgba(255, 159, 26, 0.8);
            transform: translateY(-2px);
        }

        .error-message {
            color: #ff4757;
            font-family: var(--rel-font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 14px;
            display: none;
        }

        /* Timers Grid */
        .timers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .timer-card {
            background: linear-gradient(160deg, #1c1005 0%, #100802 100%);
            border: 2px solid #3d2309;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.85);
            position: relative;
            transition: all 0.2s ease;
        }

        .timer-card:hover {
            border-color: #ff9f1a;
            box-shadow: 0 0 25px rgba(255, 159, 26, 0.25);
            transform: translateY(-2px);
        }

        .timer-title {
            font-family: var(--rel-font-display);
            font-size: 1.25rem;
            color: #ffffff;
            font-weight: 800;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 36px; 
            letter-spacing: 0.5px;
        }

        .timer-target {
            font-family: var(--rel-font-mono);
            font-size: 0.75rem;
            color: #ff9f1a;
            margin-bottom: 18px;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .countdown-display {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .time-box {
            background: #060301;
            border: 1.5px solid #281504;
            border-radius: 10px;
            padding: 12px 6px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.9);
        }

        .time-value {
            font-family: var(--rel-font-mono);
            font-size: 1.6rem;
            font-weight: 900;
            color: #ff9f1a;
            text-shadow: 0 0 14px rgba(255, 159, 26, 0.6);
        }

        .time-label {
            font-family: var(--rel-font-mono);
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .btn-delete {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid rgba(255, 71, 87, 0.4);
            border-radius: 6px;
            color: #ff4757;
            font-size: 0.9rem;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: #ff4757;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 71, 87, 0.6);
        }

        @media (max-width: 768px) {
            .controls { grid-template-columns: 1fr; }
            .btn-start { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="timer-wrapper">
        <div class="app-container">
            
            <div class="input-card rel-tactile-surface">
                <div class="brand-header">
                    <img src="logo.png" alt="The Rel Works Logo" class="brand-logo" onerror="this.style.display='none'">
                    <div class="brand-text-container">
                        <span class="launch-badge">CAPE CANAVERAL LAUNCHPAD</span>
                        <h1 class="brand-title">T-MINUS CHRONOMETER</h1>
                        <p class="brand-subtitle">THE REL WORKS // MISSION LAUNCHPAD & LIFTOFF TELEMETRY</p>
                    </div>
                </div>

                <div class="controls">
                    <div class="control-group">
                        <label for="event-name">Mission Name / Objective</label>
                        <input type="text" id="event-name" placeholder="e.g., Orbital Launch Stage 1">
                    </div>
                    <div class="control-group">
                        <label for="event-date">Target Date</label>
                        <input type="date" id="event-date">
                    </div>
                    <div class="control-group">
                        <label for="event-time">Target Time (Optional)</label>
                        <input type="time" id="event-time">
                    </div>
                    <button class="btn-start" id="btn-start">ENGAGE TIMER</button>
                </div>

                <div class="error-message" id="error-message"></div>
            </div>

            <div class="timers-grid" id="timers-grid"></div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/rel-audio.js"></script>
    <script src="js/rel-hud.js"></script>
    <script>
        // DOM Elements
        const eventNameInput = document.getElementById('event-name');
        const eventDateInput = document.getElementById('event-date');
        const eventTimeInput = document.getElementById('event-time');
        const startBtn = document.getElementById('btn-start');
        const errorMsg = document.getElementById('error-message');
        const timersGrid = document.getElementById('timers-grid');

        let events = JSON.parse(localStorage.getItem('relWorksEvents')) || [];
        let globalTimer = null;

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
            if (window.RelAudio) window.RelAudio.error();
        }

        function clearError() {
            errorMsg.style.display = 'none';
        }

        function addEvent() {
            clearError();

            const name = eventNameInput.value.trim();
            const dateVal = eventDateInput.value;
            const timeVal = eventTimeInput.value;

            if (!name) {
                return showError("Warning: Mission name cannot be blank.");
            }

            if (!dateVal) {
                return showError("Warning: Please select a valid target date.");
            }

            const dateTimeString = timeVal ? `${dateVal}T${timeVal}` : `${dateVal}T00:00:00`;
            const targetDate = new Date(dateTimeString);

            if (isNaN(targetDate.getTime())) {
                return showError("Warning: Date or time entered is invalid.");
            }

            const now = new Date();
            const timeDiffMs = targetDate.getTime() - now.getTime();

            if (timeDiffMs <= 0) {
                return showError("Warning: Mission time must be set in the future.");
            }

            const maxAllowedDiff = 1000 * 60 * 60 * 24 * 365 * 100;
            if (timeDiffMs > maxAllowedDiff) {
                return showError("Warning: Mission target exceeds maximum 100-year telemetry range.");
            }

            events.push({
                id: Date.now().toString(),
                name: name,
                target: targetDate.getTime(),
                notified: false
            });

            saveEvents();
            renderTimers();
            startLoop();

            eventNameInput.value = '';
            eventDateInput.value = '';
            eventTimeInput.value = '';
            if (window.RelAudio) window.RelAudio.success();
        }

        function deleteEvent(id) {
            events = events.filter(e => e.id !== id);
            saveEvents();
            renderTimers();
            if (events.length === 0) clearInterval(globalTimer);
            if (window.RelAudio) window.RelAudio.click();
        }

        function saveEvents() {
            localStorage.setItem('relWorksEvents', JSON.stringify(events));
        }

        function calculateRemaining(targetTimestamp) {
            const now = new Date();
            const target = new Date(targetTimestamp);
            const totalMs = target.getTime() - now.getTime();

            if (totalMs <= 0) {
                return { total: 0, months: 0, days: 0, hours: 0, minutes: 0, seconds: 0 };
            }

            let months = (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth());
            
            let tempDate = new Date(now);
            tempDate.setMonth(now.getMonth() + months);

            if (tempDate > target) {
                months--;
                tempDate = new Date(now);
                tempDate.setMonth(now.getMonth() + months);
            }

            const diffAfterMonths = target.getTime() - tempDate.getTime();

            const days = Math.floor(diffAfterMonths / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffAfterMonths / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diffAfterMonths / 1000 / 60) % 60);
            const seconds = Math.floor((diffAfterMonths / 1000) % 60);

            return { total: totalMs, months, days, hours, minutes, seconds };
        }

        function createTimerCard(event) {
            const dateObj = new Date(event.target);
            const formattedTarget = dateObj.toLocaleString([], { 
                weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', 
                hour: '2-digit', minute: '2-digit'
            });

            return `
                <div class="timer-card rel-tactile-surface" id="card-${event.id}">
                    <button class="btn-delete" onclick="deleteEvent('${event.id}')" title="Abort Mission Countdown">✖</button>
                    <h3 class="timer-title">${event.name}</h3>
                    <div class="timer-target">T-MINUS TARGET: ${formattedTarget}</div>
                    
                    <div class="countdown-display">
                        <div class="time-box">
                            <div class="time-value" id="mo-${event.id}">00</div>
                            <div class="time-label">Months</div>
                        </div>
                        <div class="time-box">
                            <div class="time-value" id="d-${event.id}">00</div>
                            <div class="time-label">Days</div>
                        </div>
                        <div class="time-box">
                            <div class="time-value" id="h-${event.id}">00</div>
                            <div class="time-label">Hours</div>
                        </div>
                        <div class="time-box">
                            <div class="time-value" id="m-${event.id}">00</div>
                            <div class="time-label">Mins</div>
                        </div>
                        <div class="time-box">
                            <div class="time-value" id="s-${event.id}">00</div>
                            <div class="time-label">Secs</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTimers() {
            timersGrid.innerHTML = events.map(e => createTimerCard(e)).join('');
            updateDOM();
        }

        function updateDOM() {
            let stateChanged = false;

            events.forEach(event => {
                const remaining = calculateRemaining(event.target);
                
                const mEl = document.getElementById(`mo-${event.id}`);
                const dEl = document.getElementById(`d-${event.id}`);
                const hEl = document.getElementById(`h-${event.id}`);
                const minEl = document.getElementById(`m-${event.id}`);
                const sEl = document.getElementById(`s-${event.id}`);
                
                if (mEl) mEl.innerText = remaining.months.toString().padStart(2, '0');
                if (dEl) dEl.innerText = remaining.days.toString().padStart(2, '0');
                if (hEl) hEl.innerText = remaining.hours.toString().padStart(2, '0');
                if (minEl) minEl.innerText = remaining.minutes.toString().padStart(2, '0');
                if (sEl) sEl.innerText = remaining.seconds.toString().padStart(2, '0');

                if (remaining.total <= 0 && !event.notified) {
                    event.notified = true;
                    stateChanged = true;
                    if (window.RelAudio) window.RelAudio.alarm(3);
                    setTimeout(() => alert(`🚨 T-MINUS ZERO: Mission '${event.name}' has reached liftoff!`), 100);
                }
            });

            if (stateChanged) saveEvents();
        }

        function startLoop() {
            if (globalTimer) clearInterval(globalTimer);
            if (events.length > 0) {
                globalTimer = setInterval(updateDOM, 1000);
            }
        }

        startBtn.addEventListener('click', addEvent);

        if (events.length > 0) {
            renderTimers();
            startLoop();
        }
    </script>
</body>
</html>
