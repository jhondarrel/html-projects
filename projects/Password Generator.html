<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Keyforge // Password Generator</title>
    
    <link rel="stylesheet" href="css/rel-core.css">

    <style>
        :root {
            --vault-cyan: #00f3ff;
            --vault-purple: #70a1ff;
            --vault-green: #2ed573;
            --vault-amber: #ffa502;
            --vault-red: #ff4757;
        }

        body {
            background: radial-gradient(circle at 50% 15%, #0e1628 0%, #070c18 50%, #03060c 100%);
            min-height: 100vh;
            color: #f0f4fc;
        }

        .vault-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - var(--rel-hud-height));
            padding: 30px 20px;
        }

        .vault-card {
            background: linear-gradient(160deg, #121a2d 0%, #0a0f1d 60%, #050811 100%);
            padding: 38px 44px;
            border-radius: 24px;
            border: 2px solid #1c2b48;
            box-shadow: 
                0 0 0 1px rgba(0, 243, 255, 0.3),
                0 0 45px rgba(0, 243, 255, 0.15),
                0 25px 60px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
        }

        /* Top Cyberpunk Neon Vault Rim */
        .vault-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 30px;
            right: 30px;
            height: 3px;
            background: linear-gradient(90deg, #00f3ff, #70a1ff, #2ed573, #00f3ff);
            border-radius: 0 0 4px 4px;
            box-shadow: 0 0 16px rgba(0, 243, 255, 0.8);
        }

        /* Brand Header */
        .brand-header {
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1.5px solid rgba(0, 243, 255, 0.25);
            padding-bottom: 20px;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            border: 1.5px solid #00f3ff;
            box-shadow: 0 0 16px rgba(0, 243, 255, 0.4);
            object-fit: cover;
            background: #000;
        }

        .brand-text-container {
            display: flex;
            flex-direction: column;
        }

        .vault-badge {
            display: inline-block;
            align-self: flex-start;
            font-family: var(--rel-font-mono);
            font-size: 0.62rem;
            color: #00f3ff;
            background: rgba(0, 243, 255, 0.15);
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: 1px;
            font-weight: 700;
            margin-bottom: 4px;
            border: 1px solid rgba(0, 243, 255, 0.35);
        }

        .brand-title {
            color: #ffffff;
            font-family: var(--rel-font-display);
            font-size: 1.45rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            line-height: 1.1;
        }

        .brand-subtitle {
            color: #70a1ff;
            font-family: var(--rel-font-mono);
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 3px;
            letter-spacing: 0.6px;
        }

        /* --- Password Output Chamber --- */
        .output-chamber {
            position: relative;
            background: #040812;
            border: 2px solid rgba(0, 243, 255, 0.4);
            border-radius: 16px;
            padding: 20px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(0, 243, 255, 0.1);
            gap: 14px;
        }

        .password-display {
            font-family: var(--rel-font-mono);
            font-size: 1.45rem;
            font-weight: 800;
            color: #00f3ff;
            text-shadow: 0 0 14px rgba(0, 243, 255, 0.6);
            letter-spacing: 2px;
            word-break: break-all;
            user-select: all;
            flex: 1;
        }

        .btn-copy {
            background: linear-gradient(180deg, #1e3a64 0%, #0d1e38 100%);
            color: #00f3ff;
            border: 1.5px solid rgba(0, 243, 255, 0.5);
            padding: 12px 18px;
            border-radius: 10px;
            font-family: var(--rel-font-display);
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.25);
            white-space: nowrap;
            outline: none;
        }

        .btn-copy:hover {
            background: #00f3ff;
            color: #040812;
            box-shadow: 0 0 24px rgba(0, 243, 255, 0.7);
            transform: scale(1.04);
        }

        /* --- Entropy Strength Meter --- */
        .strength-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .strength-labels {
            display: flex;
            justify-content: space-between;
            font-family: var(--rel-font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .strength-meter-bar {
            width: 100%;
            height: 8px;
            background: #070e1c;
            border: 1px solid #1a2944;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            background: #2ed573;
            box-shadow: 0 0 12px #2ed573;
            transition: width 0.3s ease, background 0.3s ease;
        }

        /* --- Length & Mode Sliders --- */
        .controls-deck {
            background: #060b17;
            padding: 22px;
            border-radius: 16px;
            border: 1.5px solid #16243d;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-family: var(--rel-font-mono);
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
        }

        .slider-header span {
            color: #00f3ff;
            font-size: 1.1rem;
            font-weight: 800;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            background: #0d182b;
            border-radius: 4px;
            border: 1px solid #1f3458;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #00f3ff;
            box-shadow: 0 0 14px rgba(0, 243, 255, 0.8);
            border: 2px solid #ffffff;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: #2ed573;
            box-shadow: 0 0 16px rgba(46, 213, 115, 0.9);
        }

        /* --- Option Checkboxes --- */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-family: var(--rel-font-mono);
            font-size: 0.82rem;
            color: #e2e8f0;
            font-weight: 600;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .checkbox-label:hover {
            background: rgba(0, 243, 255, 0.08);
            border-color: rgba(0, 243, 255, 0.3);
        }

        .checkbox-label input {
            accent-color: #00f3ff;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* Mode Selector */
        .mode-toggles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .mode-btn {
            background: #091222;
            border: 1.5px solid #1a2a47;
            color: #94a3b8;
            padding: 10px;
            border-radius: 10px;
            font-family: var(--rel-font-mono);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .mode-btn.active {
            background: rgba(0, 243, 255, 0.15);
            border-color: #00f3ff;
            color: #00f3ff;
            box-shadow: 0 0 16px rgba(0, 243, 255, 0.3);
        }

        /* Generate Action Button */
        .btn-generate {
            background: linear-gradient(180deg, #00f3ff 0%, #0099cc 100%);
            color: #020814;
            border: 1.5px solid rgba(0, 243, 255, 0.6);
            padding: 16px;
            border-radius: 12px;
            font-family: var(--rel-font-display);
            font-size: 1.15rem;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4);
            outline: none;
        }

        .btn-generate:hover {
            background: #38f9ff;
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.8);
            transform: translateY(-2px);
        }

        /* Toast */
        #toast {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #00f3ff;
            color: #030814;
            padding: 10px 24px;
            border-radius: 30px;
            font-family: var(--rel-font-mono);
            font-weight: 800;
            font-size: 0.85rem;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
            z-index: 100;
        }

        #toast.show {
            bottom: 25px;
            opacity: 1;
            visibility: visible;
        }

        @media (max-width: 600px) {
            .options-grid { grid-template-columns: 1fr; }
            .output-chamber { flex-direction: column; align-items: stretch; }
            .btn-copy { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="vault-wrapper">
        <div class="vault-card rel-tactile-surface">
            
            <div class="brand-header">
                <img src="logo.png" alt="The Rel Works Logo" class="brand-logo" onerror="this.style.display='none'">
                <div class="brand-text-container">
                    <span class="vault-badge">KEYFORGE ENTROPY VAULT</span>
                    <h1 class="brand-title">CYBERPUNK KEYFORGE</h1>
                    <p class="brand-subtitle">THE REL WORKS // CRYPTOGRAPHIC KEY GENERATOR</p>
                </div>
            </div>

            <!-- Password Display Chamber -->
            <div class="output-chamber">
                <div class="password-display" id="password-display">Generating...</div>
                <button class="btn-copy" id="btn-copy">COPY KEY</button>
            </div>

            <!-- Entropy Strength Meter -->
            <div class="strength-container">
                <div class="strength-labels">
                    <span style="color: #94a3b8;">ENTROPY ESTIMATE:</span>
                    <span id="strength-label" style="color: #2ed573;">128 BITS // QUANTUM FORTIFIED</span>
                </div>
                <div class="strength-meter-bar">
                    <div class="strength-fill" id="strength-fill"></div>
                </div>
            </div>

            <!-- Controls Deck -->
            <div class="controls-deck">
                
                <div class="mode-toggles">
                    <button class="mode-btn active" id="mode-random" onclick="setMode('random')">RANDOM CIPHER</button>
                    <button class="mode-btn" id="mode-passphrase" onclick="setMode('passphrase')">DICEWARE PHRASE</button>
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <span id="length-label">Key Length</span>
                        <span id="length-val">16</span>
                    </div>
                    <input type="range" id="length-slider" min="8" max="64" value="16">
                </div>

                <div class="options-grid" id="options-panel">
                    <label class="checkbox-label">
                        <input type="checkbox" id="opt-upper" checked>
                        Uppercase (A-Z)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="opt-lower" checked>
                        Lowercase (a-z)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="opt-numbers" checked>
                        Numbers (0-9)
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="opt-symbols" checked>
                        Symbols (!@#$%)
                    </label>
                </div>

            </div>

            <button class="btn-generate" id="btn-generate">GENERATE NEW CIPHER</button>

            <div id="toast">KEY COPIED TO BUFFER</div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/rel-audio.js"></script>
    <script src="js/rel-hud.js"></script>
    <script>
        const displayEl = document.getElementById('password-display');
        const lengthSlider = document.getElementById('length-slider');
        const lengthVal = document.getElementById('length-val');
        const lengthLabel = document.getElementById('length-label');
        const btnCopy = document.getElementById('btn-copy');
        const btnGenerate = document.getElementById('btn-generate');
        const strengthFill = document.getElementById('strength-fill');
        const strengthLabel = document.getElementById('strength-label');
        const toast = document.getElementById('toast');

        const optUpper = document.getElementById('opt-upper');
        const optLower = document.getElementById('opt-lower');
        const optNumbers = document.getElementById('opt-numbers');
        const optSymbols = document.getElementById('opt-symbols');
        const optionsPanel = document.getElementById('options-panel');

        let currentMode = 'random'; // 'random' or 'passphrase'

        const wordList = [
            "quantum", "falcon", "crimson", "cipher", "matrix", "orbital", "vanguard",
            "hyperion", "cobalt", "stellar", "nebula", "zenith", "vortex", "pulse",
            "titan", "aurora", "solaris", "shadow", "circuit", "beacon", "chronos",
            "reactor", "phoenix", "glacier", "prism", "tempest", "eclipse", "vector"
        ];

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('mode-random').classList.toggle('active', mode === 'random');
            document.getElementById('mode-passphrase').classList.toggle('active', mode === 'passphrase');

            if (mode === 'passphrase') {
                lengthLabel.innerText = "Word Count";
                lengthSlider.min = 3;
                lengthSlider.max = 8;
                lengthSlider.value = 4;
                lengthVal.innerText = "4";
                optionsPanel.style.display = 'none';
            } else {
                lengthLabel.innerText = "Key Length";
                lengthSlider.min = 8;
                lengthSlider.max = 64;
                lengthSlider.value = 16;
                lengthVal.innerText = "16";
                optionsPanel.style.display = 'grid';
            }

            generatePassword();
            if (window.RelAudio) window.RelAudio.click();
        }

        function calculateStrength(pwd) {
            let pool = 0;
            if (currentMode === 'passphrase') {
                pool = wordList.length;
                const words = pwd.split('-').length;
                const bits = Math.round(words * Math.log2(pool));
                updateStrengthUI(bits, `DICELOCK // ~${bits} BITS`);
                return;
            }

            if (optUpper.checked) pool += 26;
            if (optLower.checked) pool += 26;
            if (optNumbers.checked) pool += 10;
            if (optSymbols.checked) pool += 32;

            if (pool === 0) {
                updateStrengthUI(0, "INSECURE // SELECT OPTIONS");
                return;
            }

            const bits = Math.round(pwd.length * Math.log2(pool));
            let label = "";

            if (bits < 45) {
                label = `${bits} BITS // WEAK CONDUIT`;
            } else if (bits < 75) {
                label = `${bits} BITS // SECURE REINFORCED`;
            } else if (bits < 110) {
                label = `${bits} BITS // QUANTUM FORTIFIED`;
            } else {
                label = `${bits} BITS // UNCRACKABLE CIPHER`;
            }

            updateStrengthUI(bits, label);
        }

        function updateStrengthUI(bits, label) {
            strengthLabel.innerText = label;
            const pct = Math.min(100, Math.max(10, Math.round((bits / 128) * 100)));
            strengthFill.style.width = `${pct}%`;

            if (bits < 45) {
                strengthFill.style.background = "#ff4757";
                strengthFill.style.boxShadow = "0 0 12px #ff4757";
                strengthLabel.style.color = "#ff4757";
            } else if (bits < 75) {
                strengthFill.style.background = "#ffa502";
                strengthFill.style.boxShadow = "0 0 12px #ffa502";
                strengthLabel.style.color = "#ffa502";
            } else {
                strengthFill.style.background = "#2ed573";
                strengthFill.style.boxShadow = "0 0 12px #2ed573";
                strengthLabel.style.color = "#2ed573";
            }
        }

        function generatePassword() {
            if (currentMode === 'passphrase') {
                const count = parseInt(lengthSlider.value);
                const chosen = [];
                for (let i = 0; i < count; i++) {
                    const idx = Math.floor(Math.random() * wordList.length);
                    chosen.push(wordList[idx]);
                }
                const num = Math.floor(Math.random() * 90 + 10);
                const pwd = chosen.join('-') + '-' + num;
                displayEl.innerText = pwd;
                calculateStrength(pwd);
                return;
            }

            let chars = '';
            if (optUpper.checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (optLower.checked) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (optNumbers.checked) chars += '0123456789';
            if (optSymbols.checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (!chars) {
                displayEl.innerText = "Select at least 1 option!";
                calculateStrength('');
                return;
            }

            const len = parseInt(lengthSlider.value);
            let result = '';
            const array = new Uint32Array(len);
            window.crypto.getRandomValues(array);

            for (let i = 0; i < len; i++) {
                result += chars[array[i] % chars.length];
            }

            displayEl.innerText = result;
            calculateStrength(result);
        }

        lengthSlider.addEventListener('input', (e) => {
            lengthVal.innerText = e.target.value;
            generatePassword();
            if (window.RelAudio) window.RelAudio.tick();
        });

        [optUpper, optLower, optNumbers, optSymbols].forEach(opt => {
            opt.addEventListener('change', () => {
                generatePassword();
                if (window.RelAudio) window.RelAudio.click();
            });
        });

        btnGenerate.addEventListener('click', () => {
            generatePassword();
            if (window.RelAudio) window.RelAudio.snap();
        });

        btnCopy.addEventListener('click', () => {
            const text = displayEl.innerText;
            if (text && !text.includes("Select")) {
                navigator.clipboard.writeText(text).then(() => {
                    toast.classList.add('show');
                    if (window.RelAudio) window.RelAudio.chirp(1300);
                    setTimeout(() => toast.classList.remove('show'), 2000);
                });
            }
        });

        // Generate on load
        generatePassword();
    </script>
</body>
</html>
