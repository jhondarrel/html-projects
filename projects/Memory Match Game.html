<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Neural Deck // Memory Match Matrix</title>
    
    <link rel="stylesheet" href="css/rel-core.css">

    <style>
        :root {
            --mem-pink: #ff71ce;
            --mem-cyan: #01cdfe;
            --mem-purple: #b967ff;
            --mem-gold: #ffd32a;
            --mem-dark: #070614;
            --mem-card-bg: rgba(15, 12, 32, 0.85);
        }

        body {
            background: radial-gradient(circle at 50% 12%, #1e0c33 0%, #0c0517 50%, #030107 100%);
            min-height: 100vh;
            color: #f1f2f6;
            user-select: none;
        }

        .mem-wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: calc(100vh - var(--rel-hud-height));
            padding: 30px 20px;
        }

        .mem-container {
            width: 100%;
            max-width: 980px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* --- Header Deck --- */
        .mem-header {
            background: linear-gradient(160deg, #240a38 0%, #120520 60%, #07020e 100%);
            padding: 24px 34px;
            border-radius: 20px;
            border: 2px solid #48196c;
            box-shadow: 
                0 0 0 1px rgba(255, 113, 206, 0.3),
                0 0 40px rgba(255, 113, 206, 0.15),
                0 20px 50px rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
        }

        .mem-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 25px;
            right: 25px;
            height: 3px;
            background: linear-gradient(90deg, #ff71ce, #01cdfe, #b967ff, #ff71ce);
            border-radius: 0 0 4px 4px;
            box-shadow: 0 0 16px rgba(255, 113, 206, 0.8);
        }

        .mem-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .mem-logo-badge {
            width: 52px;
            height: 52px;
            background: rgba(255, 113, 206, 0.1);
            border: 2px solid var(--mem-pink);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 0 20px rgba(255, 113, 206, 0.4);
        }

        .mem-title {
            font-family: var(--rel-font-display);
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1px;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 113, 206, 0.4);
        }

        .mem-subtitle {
            font-family: var(--rel-font-sans);
            font-size: 0.88rem;
            color: var(--mem-cyan);
            margin-top: 4px;
            font-weight: 600;
        }

        /* --- Telemetry Ribbon --- */
        .mem-telemetry-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            background: var(--mem-card-bg);
            padding: 14px 24px;
            border-radius: 14px;
            border: 1px solid #3c1959;
        }

        .tele-stat-group {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .tele-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .tele-lbl {
            font-family: var(--rel-font-mono);
            font-size: 0.68rem;
            font-weight: 700;
            color: #a4b0be;
            text-transform: uppercase;
        }

        .tele-val {
            font-family: var(--rel-font-mono);
            font-size: 1.25rem;
            font-weight: 900;
            color: #ffffff;
        }

        .combo-badge {
            background: linear-gradient(135deg, #ff71ce, #b967ff);
            color: #07020e;
            font-family: var(--rel-font-mono);
            font-size: 0.88rem;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(255, 113, 206, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .grid-size-btn {
            background: rgba(30, 14, 48, 0.7);
            border: 1px solid #48196c;
            color: #8c7ae6;
            padding: 6px 14px;
            border-radius: 8px;
            font-family: var(--rel-font-mono);
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .grid-size-btn.active {
            background: var(--mem-pink);
            color: #07020e;
            border-color: var(--mem-pink);
            box-shadow: 0 0 12px rgba(255, 113, 206, 0.4);
        }

        .restart-game-btn {
            background: rgba(255, 113, 206, 0.15);
            border: 1px solid var(--mem-pink);
            color: var(--mem-pink);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: var(--rel-font-mono);
            font-size: 0.84rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .restart-game-btn:hover {
            background: var(--mem-pink);
            color: #07020e;
            box-shadow: 0 0 18px rgba(255, 113, 206, 0.6);
        }

        /* --- 3D Cards Arena --- */
        .cards-grid {
            display: grid;
            gap: 16px;
            perspective: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .cards-grid.grid-4x4 {
            grid-template-columns: repeat(4, 1fr);
            max-width: 640px;
        }

        .cards-grid.grid-6x4 {
            grid-template-columns: repeat(6, 1fr);
            max-width: 900px;
        }

        @media (max-width: 640px) {
            .cards-grid.grid-6x4 {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .card-scene {
            aspect-ratio: 1 / 1;
            perspective: 800px;
            cursor: pointer;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 16px;
        }

        .card-scene.flipped .card-inner,
        .card-scene.matched .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
        }

        /* Card Back (Faced Down) */
        .card-back {
            background: linear-gradient(145deg, #1f0b30 0%, #0d0417 100%);
            border: 2px solid #3c1959;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .card-back::after {
            content: '❖';
            font-size: 1.8rem;
            color: rgba(255, 113, 206, 0.4);
            text-shadow: 0 0 10px rgba(255, 113, 206, 0.3);
        }

        .card-scene:hover .card-back {
            border-color: var(--mem-pink);
            box-shadow: 0 0 20px rgba(255, 113, 206, 0.35);
        }

        /* Card Front (Faced Up) */
        .card-front {
            background: linear-gradient(145deg, #2a0e44 0%, #150624 100%);
            border: 2px solid var(--mem-cyan);
            transform: rotateY(180deg);
            font-size: 2.4rem;
            box-shadow: 0 0 25px rgba(1, 205, 254, 0.3);
        }

        .card-scene.matched .card-front {
            border-color: #2ed573;
            box-shadow: 0 0 30px rgba(46, 213, 115, 0.4);
            animation: matchPulse 0.4s ease;
        }

        @keyframes matchPulse {
            0% { transform: rotateY(180deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.08); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        /* Victory Overlay Modal */
        .victory-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 2, 10, 0.88);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .victory-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .victory-card {
            background: linear-gradient(160deg, #2b0b42 0%, #150422 100%);
            border: 2px solid var(--mem-pink);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 0 60px rgba(255, 113, 206, 0.35), 0 30px 70px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            text-align: center;
        }

        .victory-stars {
            font-size: 2.8rem;
            letter-spacing: 6px;
        }

        .victory-title {
            font-family: var(--rel-font-display);
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            margin: 0;
            text-shadow: 0 0 20px rgba(255, 113, 206, 0.6);
        }

        .victory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }

        .vic-stat-box {
            background: rgba(10, 4, 16, 0.8);
            border: 1px solid #3c1959;
            padding: 14px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="mem-wrapper">
        <div class="mem-container">
            
            <!-- Header Deck -->
            <header class="mem-header">
                <div class="mem-brand">
                    <div class="mem-logo-badge">🧠</div>
                    <div>
                        <h1 class="mem-title">HOLOGRAPHIC NEURAL DECK</h1>
                        <div class="mem-subtitle">3D Memory Matrix // Dynamic Pitch Harmonic Combos</div>
                    </div>
                </div>

                <div class="tele-stat-group">
                    <span class="tele-lbl">GRID SIZE:</span>
                    <button class="grid-size-btn active" data-grid="4x4">4x4 (16 CARDS)</button>
                    <button class="grid-size-btn" data-grid="6x4">6x4 (24 CARDS)</button>
                </div>
            </header>

            <!-- Telemetry Bar -->
            <div class="mem-telemetry-bar">
                <div class="tele-stat-group">
                    <div class="tele-item">
                        <span class="tele-lbl">MOVES</span>
                        <span class="tele-val" id="disp-moves">0</span>
                    </div>
                    <div class="tele-item">
                        <span class="tele-lbl">TIME</span>
                        <span class="tele-val" id="disp-time" style="color: var(--mem-cyan);">00:00</span>
                    </div>
                    <div class="tele-item">
                        <span class="tele-lbl">PAIRS FOUND</span>
                        <span class="tele-val" id="disp-pairs" style="color: #2ed573;">0 / 8</span>
                    </div>
                </div>

                <div class="tele-stat-group">
                    <div class="combo-badge" id="disp-combo">STREAK: 1X</div>
                    <button class="restart-game-btn" id="btn-restart">↺ RESHUFFLE DECK</button>
                </div>
            </div>

            <!-- Cards Arena -->
            <div class="cards-grid grid-4x4" id="cards-arena">
                <!-- Injected via JavaScript -->
            </div>

        </div>
    </div>

    <!-- Victory Modal -->
    <div class="victory-overlay" id="victory-modal">
        <div class="victory-card">
            <div class="victory-stars" id="vic-stars">★★★</div>
            <h2 class="victory-title">NEURAL LINK SYNCHRONIZED!</h2>
            <p style="color: #dcdde1; font-size: 0.95rem; margin: 0;">You cleared the quantum card matrix with supreme neural fidelity.</p>

            <div class="victory-grid">
                <div class="vic-stat-box">
                    <span class="tele-lbl">FINAL TIME</span>
                    <span class="tele-val" id="vic-time" style="color: var(--mem-cyan);">00:00</span>
                </div>
                <div class="vic-stat-box">
                    <span class="tele-lbl">MOVES</span>
                    <span class="tele-val" id="vic-moves">0</span>
                </div>
                <div class="vic-stat-box">
                    <span class="tele-lbl">MAX STREAK</span>
                    <span class="tele-val" id="vic-streak" style="color: var(--mem-pink);">0X</span>
                </div>
            </div>

            <button class="restart-game-btn" id="btn-vic-restart" style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 10px;">
                PLAY NEXT ROUND
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/rel-audio.js"></script>
    <script src="js/rel-hud.js"></script>
    <script>
        const GLYPH_POOL = [
            '⚡', '💎', '🚀', '🔑', '🪐', '🔮', '🛰️', '🧬',
            '🛸', '👾', '🌈', '🔥', '🛡️', '⚙️', '🌟', '💻'
        ];

        let gridSize = '4x4'; // '4x4' or '6x4'
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let totalPairs = 8;
        let moves = 0;
        let streak = 0;
        let maxStreak = 0;
        let isLocked = false;
        let timer = null;
        let elapsedSeconds = 0;
        let isStarted = false;

        // Elements
        const arena = document.getElementById('cards-arena');
        const dispMoves = document.getElementById('disp-moves');
        const dispTime = document.getElementById('disp-time');
        const dispPairs = document.getElementById('disp-pairs');
        const dispCombo = document.getElementById('disp-combo');
        const victoryModal = document.getElementById('victory-modal');
        const vicStars = document.getElementById('vic-stars');
        const vicTime = document.getElementById('vic-time');
        const vicMoves = document.getElementById('vic-moves');
        const vicStreak = document.getElementById('vic-streak');

        // Harmonic Musical Streak Synthesizer
        function playStreakChord(streakCount) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const c = new AudioCtx();
            const t = c.currentTime;

            // Musical major scale intervals based on streak
            const baseFreq = 440; // A4
            const intervals = [0, 4, 7, 12, 16, 19, 24]; // Root, 3rd, 5th, Octave, 10th...
            const step = Math.min(streakCount - 1, intervals.length - 1);
            const freq = baseFreq * Math.pow(2, intervals[step] / 12);

            [freq, freq * 1.25, freq * 1.5].forEach((f, idx) => {
                const osc = c.createOscillator();
                const gain = c.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(f, t + idx * 0.04);
                gain.gain.setValueAtTime(0.12, t + idx * 0.04);
                gain.gain.exponentialRampToValueAtTime(0.0001, t + idx * 0.04 + 0.35);
                osc.connect(gain);
                gain.connect(c.destination);
                osc.start(t + idx * 0.04);
                osc.stop(t + idx * 0.04 + 0.4);
            });
        }

        function formatSeconds(s) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function startTimer() {
            if (isStarted) return;
            isStarted = true;
            timer = setInterval(() => {
                elapsedSeconds++;
                dispTime.textContent = formatSeconds(elapsedSeconds);
            }, 1000);
        }

        function initGame() {
            clearInterval(timer);
            isStarted = false;
            elapsedSeconds = 0;
            moves = 0;
            streak = 0;
            maxStreak = 0;
            matchedPairs = 0;
            flippedCards = [];
            isLocked = false;

            dispMoves.textContent = '0';
            dispTime.textContent = '00:00';
            dispCombo.textContent = 'STREAK: 1X';
            victoryModal.classList.remove('open');

            totalPairs = gridSize === '4x4' ? 8 : 12;
            dispPairs.textContent = `0 / ${totalPairs}`;

            // Build Deck
            const selectedGlyphs = GLYPH_POOL.slice(0, totalPairs);
            const deck = [...selectedGlyphs, ...selectedGlyphs].sort(() => 0.5 - Math.random());

            arena.className = `cards-grid grid-${gridSize}`;
            arena.innerHTML = '';

            deck.forEach((glyph, index) => {
                const scene = document.createElement('div');
                scene.className = 'card-scene';
                scene.dataset.glyph = glyph;
                scene.dataset.index = index;

                scene.innerHTML = `
                    <div class="card-inner">
                        <div class="card-face card-back"></div>
                        <div class="card-face card-front">${glyph}</div>
                    </div>
                `;

                scene.addEventListener('click', () => handleCardClick(scene));
                arena.appendChild(scene);
            });
        }

        function handleCardClick(cardEl) {
            if (isLocked) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            startTimer();

            cardEl.classList.add('flipped');
            flippedCards.push(cardEl);

            if (window.RelAudio) window.RelAudio.click(1.2);

            if (flippedCards.length === 2) {
                isLocked = true;
                moves++;
                dispMoves.textContent = moves;

                const [c1, c2] = flippedCards;
                const isMatch = c1.dataset.glyph === c2.dataset.glyph;

                if (isMatch) {
                    streak++;
                    if (streak > maxStreak) maxStreak = streak;
                    dispCombo.textContent = `STREAK: ${streak}X!`;

                    setTimeout(() => {
                        c1.classList.add('matched');
                        c2.classList.add('matched');
                        matchedPairs++;
                        dispPairs.textContent = `${matchedPairs} / ${totalPairs}`;
                        flippedCards = [];
                        isLocked = false;

                        playStreakChord(streak);

                        if (matchedPairs === totalPairs) {
                            endGame();
                        }
                    }, 350);
                } else {
                    streak = 0;
                    dispCombo.textContent = 'STREAK: 1X';

                    setTimeout(() => {
                        c1.classList.remove('flipped');
                        c2.classList.remove('flipped');
                        flippedCards = [];
                        isLocked = false;
                        if (window.RelAudio) window.RelAudio.pop();
                    }, 850);
                }
            }
        }

        function endGame() {
            clearInterval(timer);
            if (window.RelAudio) window.RelAudio.success();

            // Calculate star rating
            const parMoves = totalPairs * 1.5;
            let stars = '★★★';
            if (moves > parMoves * 1.6) stars = '★☆☆';
            else if (moves > parMoves * 1.25) stars = '★★☆';

            vicStars.textContent = stars;
            vicTime.textContent = formatSeconds(elapsedSeconds);
            vicMoves.textContent = moves;
            vicStreak.textContent = `${maxStreak}X`;

            setTimeout(() => {
                victoryModal.classList.add('open');
            }, 500);
        }

        // Grid Size Buttons
        document.querySelectorAll('.grid-size-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.grid-size-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                gridSize = btn.dataset.grid;
                initGame();
                if (window.RelAudio) window.RelAudio.snap();
            });
        });

        document.getElementById('btn-restart').addEventListener('click', () => {
            initGame();
            if (window.RelAudio) window.RelAudio.snap();
        });

        document.getElementById('btn-vic-restart').addEventListener('click', () => {
            initGame();
            if (window.RelAudio) window.RelAudio.click();
        });

        // Init
        initGame();
    </script>
</body>
</html>
